spring.application.name=claquete
server.port=${PORT:8080}
# O esquema é criado exclusivamente pelos scripts em ../scripts sql/.
# Informe DB_URL, DB_USER e DB_PASSWORD no ambiente ou no seu arquivo .env local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_acervo_filmes?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
# Necessarios para liberar exclusivamente os endpoints /api/credenciais/**.
# Defina CLAQUETE_ADMIN_USER e CLAQUETE_ADMIN_PASSWORD_HASH no ambiente. O hash
# deve ser BCrypt; nunca registre a senha em texto puro neste arquivo.
claquete.seguranca.administrador.usuario=${CLAQUETE_ADMIN_USER}
claquete.seguranca.administrador.hash-senha=${CLAQUETE_ADMIN_PASSWORD_HASH}
